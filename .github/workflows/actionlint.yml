name: Lint GitHub Actions workflows

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: devops-actions/actionlint@1127887bc5b38beddaafc906b5f293430ef6d255 # v2.0.1
        with:
          fail-on-errors: "true"
