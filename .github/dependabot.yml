version: 2
updates:
  # Keep GitHub Actions SHA pins up to date (Dependabot updates the SHA and keeps the version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      azure-actions:
        patterns:
          - "azure/*"
          - "Azure/*"
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - dependencies
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - dependencies
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/mcp-server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - dependencies
    commit-message:
      prefix: "deps(mcp)"
    groups:
      mcp:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - dependencies
    commit-message:
      prefix: "deps(vscode)"
    groups:
      vscode:
        patterns:
          - "*"
    ignore:
      # typescript-eslint only supports TypeScript below 6.1; a bump past that
      # breaks `npm ci` on a peer dependency conflict rather than failing a test.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # The engine floor is a deliberate compatibility choice (the stable
      # language model tools API), not something to track the latest release of.
      - dependency-name: "@types/vscode"
